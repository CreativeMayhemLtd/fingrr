name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crypto unit tests
        run: node scripts/test-crypto.mjs
      - name: ATProto flow integration tests (mock PDS)
        run: node scripts/test-atproto-flow.mjs
      - name: TypeScript check
        run: npx tsc --noEmit

  live-pds:
    # Live bsky.social test — only when secrets are configured, never on forks
    if: github.event_name == 'push' && github.repository == 'CreativeMayhemLtd/fingrr'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live ATProto integration test
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -z "$BSKY_HANDLE" ]; then
            echo "No live-test credentials configured — skipping."
            exit 0
          fi
          node scripts/test-live-atproto.mjs
