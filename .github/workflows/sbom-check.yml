name: SBOM & License Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (app + relay)
        run: |
          npm ci
          npm ci --prefix server --ignore-scripts

      - name: Run SBOM generator (CI mode)
        run: node tools/generate_sbom.mjs --ci
        continue-on-error: true
        id: sbom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-reports
          path: |
            sbom.json
            sbom_summary.md
            license_compatibility.md

      - name: Comment on PR with SBOM summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## SBOM & License Check\n\n';

            if (fs.existsSync('sbom_summary.md')) {
              const summary = fs.readFileSync('sbom_summary.md', 'utf8');
              const changesIdx = summary.indexOf('## Changes from Previous SBOM');
              if (changesIdx >= 0) {
                body += summary.substring(changesIdx);
              } else {
                body += 'No dependency changes detected.\n';
              }
            }

            if (fs.existsSync('license_compatibility.md')) {
              const compat = fs.readFileSync('license_compatibility.md', 'utf8');
              if (compat.includes('## FAIL')) {
                body += '\n### License Issues Found\n';
                body += 'See `license_compatibility.md` artifact for details.\n';
              } else {
                body += '\nAll licenses compatible.\n';
              }
            }

            body += `\n---\n_Generated by SBOM check workflow_`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## SBOM & License Check')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on critical issues
        if: steps.sbom.outcome == 'failure'
        run: |
          echo "SBOM check failed. See artifacts for details."
          exit 1
