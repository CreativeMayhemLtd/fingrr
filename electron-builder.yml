appId: fm.lysn.fingrr
productName: fingrr
copyright: Copyright © 2025 fingrr

# The Expo static export lands in dist/
directories:
  output: dist-electron
  buildResources: electron/assets

files:
  - electron/main.js
  - electron/preload.js
  - dist/**/*
  - package.json

# Where electron's main entry is
extraMetadata:
  main: electron/main.js

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: assets/icon.png

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [arm64]
  icon: assets/icon.png
  category: public.app-category.social-networking
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/icon.png
  category: Network

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
