services:
  relay:
    build:
      context: ./server
      target: dev
    volumes:
      - ./server/src:/app/src:ro
    ports:
      - "${RELAY_PORT:-3001}:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
