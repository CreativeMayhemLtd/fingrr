<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="r"><rect x="0" y="0" width="820" height="330" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="820" height="330" fill="#0b0b10"/>

    <!-- ── Profile card: Ana ──────────────────────────────────────────── -->
    <g>
      <rect x="28" y="78" width="200" height="150" rx="12" fill="#14141c" stroke="#23232e"/>
      <circle cx="78" cy="128" r="26" fill="#1e3a5f"/>
      <text x="78" y="137" text-anchor="middle" fill="#9ec1ff" font-size="24" font-weight="700">A</text>
      <text x="118" y="122" fill="#e8e8ef" font-size="17" font-weight="600">Ana</text>
      <text x="118" y="142" fill="#6f7284" font-size="12">Bluesky profile</text>
      <rect x="48" y="170" width="160" height="8" rx="4" fill="#1d1d27"/>
      <rect x="48" y="186" width="110" height="8" rx="4" fill="#1d1d27"/>
    </g>

    <!-- ── Profile card: Leo ──────────────────────────────────────────── -->
    <g>
      <rect x="592" y="78" width="200" height="150" rx="12" fill="#14141c" stroke="#23232e"/>
      <circle cx="642" cy="128" r="26" fill="#3b2a5f"/>
      <text x="642" y="137" text-anchor="middle" fill="#cdb2ff" font-size="24" font-weight="700">L</text>
      <text x="682" y="122" fill="#e8e8ef" font-size="17" font-weight="600">Leo</text>
      <text x="682" y="142" fill="#6f7284" font-size="12">Bluesky profile</text>
      <rect x="612" y="170" width="160" height="8" rx="4" fill="#1d1d27"/>
      <rect x="612" y="186" width="110" height="8" rx="4" fill="#1d1d27"/>
    </g>

    <!-- ── Bluesky butterfly (network) ────────────────────────────────── -->
    <g transform="translate(410,120)" opacity="0.95">
      <path d="M0,4 C-6,-14 -30,-24 -36,-12 C-40,-3 -24,6 -3,8 Z" fill="#1185fe"/>
      <path d="M0,4 C6,-14 30,-24 36,-12 C40,-3 24,6 3,8 Z" fill="#1185fe"/>
      <path d="M-2,9 C-12,12 -20,24 -10,27 C-3,29 0,19 0,11 Z" fill="#1185fe" opacity="0.85"/>
      <path d="M2,9 C12,12 20,24 10,27 C3,29 0,19 0,11 Z" fill="#1185fe" opacity="0.85"/>
      <text x="0" y="48" text-anchor="middle" fill="#55586b" font-size="12">ATProto network</text>
    </g>

    <!-- ── Plaintext bubble at Ana ────────────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        values="0;1;1;0;0" keyTimes="0;0.05;0.17;0.22;1"/>
      <rect x="60" y="238" width="120" height="40" rx="12" fill="#2563eb"/>
      <text x="120" y="263" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Hi!</text>
    </g>

    <!-- ── Sealed packet (travels Ana → Leo) ──────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.19;0.24;0.62;0.67;1"/>
      <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
        path="M 120,258 Q 410,180 700,258"
        keyPoints="0;0;1;1" keyTimes="0;0.24;0.62;1"/>
      <g transform="translate(-80,-24)">
        <rect width="160" height="48" rx="10" fill="#101019" stroke="#2a3f66" stroke-width="1.5"/>
        <!-- padlock -->
        <rect x="12" y="20" width="16" height="13" rx="2.5" fill="#86b7ff"/>
        <path d="M15,20 v-4 a5,5 0 0 1 10,0 v4" fill="none" stroke="#86b7ff" stroke-width="2.5"/>
        <text x="38" y="26" fill="#86b7ff" font-size="13" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace">9f3a 7c21 e4d8</text>
        <text x="80" y="42" text-anchor="middle" fill="#55586b" font-size="10">no sender · no recipient</text>
      </g>
    </g>

    <!-- ── Observer sees nothing ──────────────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.52;0.58;1"/>
      <g transform="translate(410,262)">
        <path d="M-18,0 Q0,-14 18,0 Q0,14 -18,0 Z" fill="none" stroke="#8a5a5a" stroke-width="2"/>
        <circle cx="0" cy="0" r="5" fill="#8a5a5a"/>
        <text x="0" y="30" text-anchor="middle" fill="#8a7a7a" font-size="12">anyone watching sees only ciphertext</text>
      </g>
    </g>

    <!-- ── Plaintext bubble at Leo ────────────────────────────────────── -->
    <g opacity="0">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        values="0;0;1;1;0" keyTimes="0;0.68;0.73;0.90;1"/>
      <rect x="640" y="238" width="120" height="40" rx="12" fill="#17a34a"/>
      <text x="700" y="263" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Hi!</text>
    </g>

    <!-- ── Caption ────────────────────────────────────────────────────── -->
    <text x="410" y="318" text-anchor="middle" fill="#55586b" font-size="13">
      end-to-end encrypted · sealed sender · your words never touch a server in the clear
    </text>
  </g>
</svg>
